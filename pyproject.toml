[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "softball-statistics"
version = "0.1.0"
description = "Track softball statistics across multiple leagues and teams."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cory Siebler" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/crsiebler/softball-statistics"
Repository = "https://github.com/crsiebler/softball-statistics"

[project.scripts]
softball-stats = "softball_statistics.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["softball_statistics*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["F401", "I"]

[tool.ruff.lint.isort]
known-first-party = ["softball_statistics"]
